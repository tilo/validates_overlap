# The test database defaults to SQLite; set DB=postgres to run against
# PostgreSQL (needed for the exclusion-constraint migration helper specs)
development:
  adapter: sqlite3
  database: db/development.sqlite3
  pool: 5
  timeout: 5000

test:
<% if ENV['DB'] == 'postgres' %>
  adapter: postgresql
  database: validates_overlap_test
  host: <%= ENV.fetch('PGHOST', 'localhost') %>
  username: <%= ENV['PGUSER'] %>
  password: <%= ENV['PGPASSWORD'] %>
  pool: 5
<% else %>
  adapter: sqlite3
  database: db/test.sqlite3
  pool: 5
  timeout: 5000
<% end %>

production:
  adapter: sqlite3
  database: db/production.sqlite3
  pool: 5
  timeout: 5000
