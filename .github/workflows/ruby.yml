# install dependencies and run tests against a Ruby x Rails matrix
# https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches:
      - main
      - maintenance-*

  pull_request:

jobs:
  test_matrix:

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.0"
          - 3.1
          - 3.2
          - 3.3
          - "3.4"
        rails:
          - "6.1"
          - "7.0"
          - "7.1"
          - "7.2"
          - "8.0"
          - "8.1"
        exclude:
          # Rails 6.1 supports Ruby up to 3.0
          - { rails: "6.1", ruby: 3.1 }
          - { rails: "6.1", ruby: 3.2 }
          - { rails: "6.1", ruby: 3.3 }
          - { rails: "6.1", ruby: "3.4" }
          # Rails 7.0 supports Ruby up to 3.2
          - { rails: "7.0", ruby: 3.3 }
          - { rails: "7.0", ruby: "3.4" }
          # Rails 7.1 supports Ruby up to 3.3
          - { rails: "7.1", ruby: "3.4" }
          # Rails 7.2 requires Ruby >= 3.1
          - { rails: "7.2", ruby: "3.0" }
          # Rails 8.0+ requires Ruby >= 3.2
          - { rails: "8.0", ruby: "3.0" }
          - { rails: "8.0", ruby: 3.1 }
          - { rails: "8.1", ruby: "3.0" }
          - { rails: "8.1", ruby: 3.1 }

    runs-on: ubuntu-latest

    # the CODECOV_TOKEN secret lives in this GitHub environment; without declaring it here, the upload step sees no token
    environment: test

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}.gemfile

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v6
      - name: setup Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake
      - name: Upload coverage to Codecov
        if: matrix.ruby == '3.4' && matrix.rails == '8.1'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/.resultset.json
          fail_ci_if_error: false

  test_postgres:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]

    name: test_postgres (${{ matrix.postgres }})

    # the CODECOV_TOKEN secret lives in this GitHub environment
    environment: test

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: validates_overlap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v6
      - name: setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run tests on PostgreSQL
        run: bundle exec rspec
      - name: Run PostgreSQL-only specs (exclusion constraints)
        run: bundle exec rspec spec_pg
      - name: Run PostgreSQL-18-only specs (WITHOUT OVERLAPS)
        if: matrix.postgres == '18'
        run: bundle exec rspec spec_pg_18
      - name: Upload coverage to Codecov
        if: matrix.postgres == '18'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/.resultset.json
          fail_ci_if_error: false

  test_mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: validates_overlap_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: root

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v6
      - name: setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run tests on MySQL
        run: bundle exec rspec

  # early warning for upcoming Rails API changes — allowed to fail, never blocks
  test_rails_head:
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_head.gemfile

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v6
      - name: setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run tests against rails main
        run: bundle exec rake

  finish:
    runs-on: ubuntu-latest
    needs: [ test_matrix, test_postgres, test_mysql ]
    steps:
      - name: Wait for status checks
        run: echo "All Green!"
